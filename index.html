<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://unpkg.com/bamboo.css" />

    <style>
      body {
        background-color: #1e222a;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      h1 {
        color: #ffffff;
        margin-bottom: 0.5rem;
      }

      h2,
      h3 {
        margin-bottom: 0.5rem;
      }

      nav {
        margin-bottom: 1rem;
      }

      #create-section textarea {
        width: 100%;
        min-height: 70px;
        background: #2a2f3a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 0.6rem;
      }

      button {
        background-color: #2f81f7;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 0.45rem 1rem;
        cursor: pointer;
        margin-top: 0.4rem;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      select {
        margin-top: 0.5rem;
        padding: 0.3rem;
        background: #2a2f3a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
      }

      .fragment-card {
        border: 1px solid #555;
        border-radius: 6px;
        background-color: #2b303b;
        padding: 0.7rem 1rem;
        margin-bottom: 0.6rem;
        line-height: 1.3;
      }

      .fragment-card p {
        margin: 0.25rem 0;
      }

      .fragment-card strong {
        color: #9cdcfe;
      }
    </style>

    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>

    <nav>
      <button id="login">Login</button>
    </nav>

    <section id="user" hidden>
      <h2 id="welcome"></h2>

      <div id="create-section">
        <h3>Create Fragment</h3>
        <textarea
          id="fragmentText"
          rows="3"
          cols="50"
          placeholder="Enter your text fragment here..."
        ></textarea>
        <br />
        <label for="fragmentType">Type:</label>
        <select id="fragmentType">
          <option value="text/plain">text/plain</option>
          <option value="application/json">application/json</option>
          <option value="text/markdown">text/markdown</option>
        </select>
        <br />
        <button id="createBtn">Create Fragment</button>
      </div>

      <div id="fragments-section">
        <h3>Your Fragments</h3>
        <div id="fragments"></div>
      </div>
    </section>
  </body>
</html>
